services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      url: docker.io/n8nio/n8n:latest
    healthCheckPath: /healthz

    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      - key: DB_TYPE
        value: postgresdb

      # Credenciales seguras (sincronizadas desde el panel de Render)
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # Configuración SSL correcta para Aiven
      - key: DB_POSTGRESDB_SSL
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # Tolerancia de tiempo para evitar "Database connection timed out"
      - key: DB_POSTGRESDB_CONNECTION_TIMEOUT
        value: "30000"

      # --- AJUSTES DE ESTABILIDAD PARA CAPA GRATUITA (512MB RAM) ---

      # Limita el Heap a 384MB para dejar 128MB libres al sistema operativo del contenedor
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"

      # Variable oficial para URL de Webhooks en n8n
      - key: N8N_WEBHOOK_URL
        value: "https://n8n-service-ggkw.onrender.com/"

      # Ajuste de timeout de tokens para CPU limitada
      - key: N8N_RUNNERS_GRANT_TOKEN_TTL
        value: "120"

      # Control de conexiones para no saturar Aiven
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "5"